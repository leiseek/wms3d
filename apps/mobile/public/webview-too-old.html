<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>需要升级 WebView</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 24px;
        line-height: 1.6;
        font-size: 18px;
        color: #222;
      }
      h1 {
        font-size: 22px;
        color: #c0392b;
      }
      .ua {
        font-size: 12px;
        color: #888;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <!-- 独立 ES5 页面：不得使用 ES2015+ 语法，不经 Vite 转译（docs/04-mobile.md §1，R2 M-N8） -->
    <h1>系统 WebView 版本过低</h1>
    <p>wms3d 需要较新的 Android System WebView（或华为 WebView）才能运行。</p>
    <p>请在应用市场更新「Android System WebView」/「华为浏览器内核」，或联系管理员更换设备。</p>
    <p class="ua" id="ua"></p>
    <script>
      var el = document.getElementById('ua');
      if (el) {
        el.appendChild(document.createTextNode('UA: ' + navigator.userAgent));
      }
    </script>
  </body>
</html>
